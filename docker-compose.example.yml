# Copy to docker-compose.yml on the server (that file is gitignored).
# Local passwords and announced IPs stay only in the server copy.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maselview
      POSTGRES_PASSWORD: maselviewsd213ad12adadas2534053gfdg4
      POSTGRES_DB: maselview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maselview"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://maselview_app:maselview_app@postgres:5432/maselview
      DIRECT_DATABASE_URL: postgresql://maselview:maselviewsd213ad12adadas2534053gfdg4@postgres:5432/maselview
      REDIS_URL: redis://redis:6379
      PORT: 3000
      FRONTEND_URL: https://unbound.maselcorp.com.br
      NODE_ENV: production
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40049
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_EXTERNAL_IP}
      TURN_PORT: 3478
    ports:
      - "127.0.0.1:8083:3000"
      # mediasoup RTP/ICE — needs to be reachable directly, it can't go through
      # the HTTP reverse proxy in front of 8083. Bound to all interfaces on
      # purpose (0.0.0.0), unlike the proxied port above. Open UDP and TCP
      # 40000-40049 on the VPS firewall as well.
      - "40000-40049:40000-40049/udp"
      - "40000-40049:40000-40049/tcp"
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # RTCHIBRIDO.mp princípio 10 — relay para o mesh P2P (mic/câmera) quando
  # STUN não basta (NAT simétrico/firewall restritivo). TURN_SECRET é
  # compartilhado com o backend (TurnService gera credenciais efêmeras a
  # partir dele); TURN_EXTERNAL_IP é o IPv4 público que os candidatos de
  # relay anunciam — mesma lógica do MEDIASOUP_ANNOUNCED_IP acima.
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=maselview
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --external-ip=${TURN_EXTERNAL_IP}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://unbound.maselcorp.com.br/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
