services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maselview
      POSTGRES_PASSWORD: maselview
      POSTGRES_DB: maselview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maselview"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      # Override the host-oriented values from .env with the in-network service names.
      # DATABASE_URL (app runtime) uses the unprivileged maselview_app role so Row-Level
      # Security on user_settings is actually enforced; DIRECT_DATABASE_URL (migrations
      # only) uses the superuser role, which needs DDL privileges RLS has nothing to do
      # with — see prisma/migrations/20260819190000_app_role_least_privilege.
      DATABASE_URL: postgresql://maselview_app:maselview_app@postgres:5432/maselview
      DIRECT_DATABASE_URL: postgresql://maselview:maselview@postgres:5432/maselview
      REDIS_URL: redis://redis:6379
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
