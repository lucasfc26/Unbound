services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maselview
      POSTGRES_PASSWORD: maselviewsd213ad12adadas2534053gfdg4
      POSTGRES_DB: maselview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maselview"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://maselview_app:maselview_app@postgres:5432/maselview
      DIRECT_DATABASE_URL: postgresql://maselview:maselviewsd213ad12adadas2534053gfdg4@postgres:5432/maselview
      REDIS_URL: redis://redis:6379
      PORT: 3000
      FRONTEND_URL: https://unbound.maselcorp.com.br
      NODE_ENV: production
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40049
    ports:
      - "127.0.0.1:8083:3000"
      # mediasoup RTP/ICE — needs to be reachable directly, it can't go through
      # the HTTP reverse proxy in front of 8083. Bound to all interfaces on
      # purpose (0.0.0.0), unlike the proxied port above.
      - "40000-40049:40000-40049/udp"
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://unbound.maselcorp.com.br
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data: